services:
  d2-mcp:
    build: .
    image: d2-mcp
    container_name: d2-mcp
    restart: unless-stopped
    # Credentials come from .env (BUNGIE_API_KEY, BUNGIE_CLIENT_ID, ...)
    env_file: .env
    environment:
      D2_MCP_DATA_DIR: /data
    ports:
      # Listens on ALL interfaces by default. Stored OAuth tokens allow account
      # writes, so set D2_MCP_AUTH_TOKEN in .env to require a bearer token on
      # /mcp and WebSocket (otherwise anyone who can reach this port gets full
      # access). Set D2_MCP_BIND=127.0.0.1 to listen on loopback only.
      - "${D2_MCP_BIND:-0.0.0.0}:3737:3000"
    volumes:
      - d2-data:/data # tokens.json + SQLite manifest cache (~350MB)
    command: ["node", "dist/index.js", "http", "--port", "3000"]

volumes:
  d2-data:
